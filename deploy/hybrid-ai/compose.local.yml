# Optional overlay: docker compose -f docker-compose.yml -f deploy/hybrid-ai/compose.local.yml --profile local-ai ...
# Select and pin a tested image, then provision models separately. No host port is published.
services:
  admin-api:
    environment:
      AI_ALLOWED_LOCAL_ENDPOINTS: http://ollama:11434
      AI_CREDENTIAL_KEYRING_FILE: /run/secrets/ai_credential_keyring
    secrets:
      - source: ai_credential_keyring
        target: ai_credential_keyring
    networks:
      - inference
  ollama:
    image: ${OLLAMA_IMAGE:?Set a tested Ollama image tag or digest}
    profiles: [local-ai]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - inference
      - model-egress
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-4g}
    cpus: ${OLLAMA_CPUS:-2}
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
networks:
  inference:
    internal: true
  model-egress: {}
volumes:
  ollama_models: {}
secrets:
  ai_credential_keyring:
    file: ${AI_CREDENTIAL_KEYRING_HOST_FILE:?Set a private managed keyring file path}
