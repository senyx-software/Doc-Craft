{
  "services": {
    "gateway": {"mem_limit": "192m"},
    "auth": {"mem_limit": "256m"},
    "notification": {"mem_limit": "256m"},
    "document": {"mem_limit": "512m"},
    "analytics": {"mem_limit": "256m"},
    "admin-api": {"mem_limit": "512m"},
    "pdf": {"mem_limit": "768m"},
    "postgres": {"mem_limit": "1024m", "image": "${POSTGRES_IMAGE:?Immutable patched PostgreSQL image required}"},
    "backup": {"image": "${POSTGRES_IMAGE:?Immutable patched PostgreSQL image required}"},
    "payment": {"mem_limit": "256m", "environment": {"PADDLE_SANDBOX": "true", "PAYHERE_SANDBOX": "true"}},
    "quota": {"mem_limit": "256m"},
    "chat": {"mem_limit": "384m"},
    "verify": {"environment": {"DOCCRAFT_REQUIRE_AI_DISABLED": "true"}},
    "edge": {
      "image": "${EDGE_IMAGE:?Immutable patched edge image required}",
      "ports": ["8443:8443"],
      "volumes": ["${DOCCRAFT_CONTROL:?}/deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro"]
    }
  }
}
