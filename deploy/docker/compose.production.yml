    "postgres": {
      "image": "postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27",
      "restart": "unless-stopped",
      "entrypoint": [
        "/bin/sh",
        "/control/deploy/staging/postgres-entrypoint.sh"
      ],
      "command": [
        "postgres",
        "-c",
        "ssl=on",
        "-c",
        "ssl_cert_file=/run/doccraft-tls/server.crt",
        "-c",
        "ssl_key_file=/run/doccraft-tls/server.key",
        "-c",
        "ssl_min_protocol_version=TLSv1.2",
        "-c",
        "hba_file=/control/deploy/staging/pg_hba.conf",
        "-c",
        "shared_buffers=128MB",
        "-c",
        "max_connections=160"
      ],
      "environment": {
        "POSTGRES_DB": "${POSTGRES_DB:?}",
        "POSTGRES_PASSWORD_FILE": "/run/secrets/postgres_password",
        "POSTGRES_INITDB_ARGS": "--auth-host=scram-sha-256"
      },
      "secrets": [
        {
          "source": "postgres_password",
          "target": "postgres_password"
        },
        {
          "source": "postgres_crt",
          "target": "postgres.crt"
        },
        {
          "source": "postgres_key",
          "target": "postgres.key"
        },
        {
          "source": "postgres_migrator_password",
          "target": "postgres_migrator_password"
        }
      ],
      "volumes": [
        "postgres:/var/lib/postgresql/data",
        "${DOCCRAFT_CONTROL:?}:/control:ro",
        "${DOCCRAFT_CONTROL:?}/deploy/scripts/bootstrap-postgres.sh:/docker-entrypoint-initdb.d/01-doccraft.sh:ro"
      ],
      "networks": [
        "backend"
      ],
      "mem_limit": "1536m",
      "cpus": 1.5,
      "healthcheck": {
        "test": [
          "CMD",
          "pg_isready",
          "-U",
          "postgres",
          "-d",
          "${POSTGRES_DB:?}"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 12
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "redis": {
      "image": "redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541",
      "restart": "unless-stopped",
      "command": [
        "redis-server",
        "--port",
        "0",
        "--tls-port",
        "6379",
        "--tls-cert-file",
        "/run/secrets/redis.crt",
        "--tls-key-file",
        "/run/secrets/redis.key",
        "--tls-ca-cert-file",
        "/run/secrets/ca.crt",
        "--tls-auth-clients",
        "no",
        "--aclfile",
        "/run/secrets/redis.acl",
        "--appendonly",
        "yes",
        "--appendfsync",
        "always",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction"
      ],
      "env_file": [
        {
          "path": "${DOCCRAFT_HOME:?}/secrets/redis-health.env",
          "format": "raw"
        }
      ],
      "secrets": [
        {
          "source": "ca",
          "target": "ca.crt"
        },
        {
          "source": "redis_crt",
          "target": "redis.crt"
        },
        {
          "source": "redis_key",
          "target": "redis.key"
        },
        {
          "source": "redis_acl",
          "target": "redis.acl"
        }
      ],
      "volumes": [
        "redis:/data"
      ],
      "networks": [
        "backend"
      ],
      "mem_limit": "384m",
      "cpus": 0.5,
      "healthcheck": {
        "test": [
          "CMD",
          "redis-cli",
          "--tls",
          "--cacert",
          "/run/secrets/ca.crt",
          "--user",
          "health",
          "ping"
        ],
        "interval": "10s",
        "timeout": "5s",
