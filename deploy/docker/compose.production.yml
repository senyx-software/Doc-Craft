{
  "name": "doccraft",
  "services": {
    "gateway": {
      "image": "${GATEWAY_IMAGE:?Immutable release digest required}",
      "init": true,
      "restart": "unless-stopped",
      "stop_grace_period": "45s",
      "working_dir": "/app/services/gateway",
      "command": [
        "node",
        "/app/services/gateway/dist/index.js"
      ],
      "env_file": [
        {
          "path": "${DOCCRAFT_RUNTIME:?}/gateway.env",
          "format": "raw"
        }
      ],
      "environment": {
        "DOCCRAFT_SERVICE": "gateway"
      },
      "secrets": [
        {
          "source": "ca",
          "target": "ca.crt"
        },
        {
          "source": "gateway_service_identity",
          "target": "service_identity"
        },
        {
          "source": "gateway_service_crt",
          "target": "service.crt"
        },
        {
          "source": "gateway_service_key",
          "target": "service.key"
        }
      ],
      "networks": [
        "backend"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "redis": {
          "condition": "service_healthy"
        }
      },
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=256m"
      ],
      "pids_limit": 256,
      "mem_limit": "256m",
      "cpus": 0.5,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "auth": {
      "image": "${AUTH_IMAGE:?Immutable release digest required}",
