<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #333; margin: 30px; line-height: 1.5; }
    .receipt-box { max-width: 600px; margin: 0 auto; border: 1px solid #e2e8f0; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .header { text-align: center; border-bottom: 2px dashed #e2e8f0; padding-bottom: 20px; margin-bottom: 20px; }
    .title { font-size: 28px; font-weight: bold; color: #38a169; text-transform: uppercase; }
    .row { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .total-row { display: flex; justify-content: space-between; border-top: 2px solid #e2e8f0; border-bottom: 2px solid #e2e8f0; padding: 15px 0; margin-top: 20px; font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
    <div class="receipt-box">
        <div class="header">
            <div class="title">Receipt</div>
            <div style="margin-top: 5px; color: #718096;">Thank you for your payment</div>
        </div>

        <div class="row">
            <span><strong>Receipt #:</strong> {{ receiptNumber }}</span>
            <span><strong>Date:</strong> {{ paymentDate }}</span>
        </div>

        <div class="row" style="margin-top: 20px;">
            <span><strong>Merchant:</strong> {{ senderName }}</span>
            <span><strong>Customer:</strong> {{ clientName }}</span>
        </div>

        <div class="row" style="margin-top: 10px;">
            <span><strong>Payment Method:</strong> {{ paymentMethod }}</span>
        </div>

        <div class="total-row">
            <span>Amount Paid:</span>
            <span>{{ currencySymbol }}{{ amountPaid | money(currency, locale) }}</span>
        </div>
    </div>
</body>
</html>
