name: CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Do not terminate a run which may already be deploying through a reusable job.
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 12
      postgres:
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: doccraft_staging_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d doccraft_staging_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      DATABASE_URL: postgresql://ci:ci-only-disposable@127.0.0.1:5432/doccraft_staging_ci
      DIRECT_URL: postgresql://ci:ci-only-disposable@127.0.0.1:5432/doccraft_staging_ci
      ADMIN_DATABASE_URL: postgresql://ci:ci-only-disposable@127.0.0.1:5432/doccraft_staging_ci
      REDIS_URL: redis://127.0.0.1:9
      PG_REQUIRE_TLS: 'false'
      CI_REDIS_URL: redis://127.0.0.1:6379
      PYTHONPATH: services/admin-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate protected release ancestry
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT" == push && "$REF" == refs/tags/* ]]; then
            [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git merge-base --is-ancestor HEAD refs/remotes/origin/master
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
            user-frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: deploy/staging/python.constraints.txt
      - name: Install locked dependencies and generate Prisma clients
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix admin
          npm ci --ignore-scripts --prefix user-frontend
          npm run db:generate
          python -m pip install -c deploy/staging/python.constraints.txt -r services/admin-api/requirements.txt -r services/document/requirements.txt -r services/analytics/requirements.txt pip-audit
      - name: Lint and build all applications
        run: |
          npm run lint --prefix admin
          npm run lint --prefix user-frontend
          npm run build
          npm run build --prefix admin
          npm run build --prefix user-frontend
          python deploy/scripts/check-build-secrets.py admin/dist user-frontend/dist
      - name: Unit, security and isolated integration tests
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)"
          npm run test:chat
          npx vitest run services/quota/src/__tests__
          python -m pytest services/admin-api/tests -q
          PYTHONPATH=services/document python -m pytest services/document/tests/test_document_contract.py services/document/tests/test_field_workflow.py services/document/tests/test_generation_integration.py services/document/tests/test_editable_templates.py services/document/tests/test_uploaded_previews.py -q
          python -m unittest discover -s deploy/tests -v
          python deploy/scripts/check-migrations.py
          python deploy/scripts/ci-migrations.py
          python deploy/scripts/ci-pdf.py
      - name: Browser editor and admin workflows (isolated HTTP fixtures)
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)"
          node scripts/verify_hybrid_ai_browser.mjs
      - name: Dependency and secret checks
        run: |
          python deploy/scripts/check-config-boundaries.py
          python deploy/scripts/install-ci-tools.py gitleaks actionlint
          .local/ci-tools/actionlint -color
          .local/ci-tools/gitleaks dir . --redact=100 --config .gitleaks.toml --no-banner
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --prefix admin
          npm audit --omit=dev --audit-level=high --prefix user-frontend
          pip-audit --strict
      - name: Terraform and production configuration checks
        run: |
          python deploy/scripts/install-ci-tools.py terraform
          .local/ci-tools/terraform -chdir=terraform fmt -check -recursive
          .local/ci-tools/terraform -chdir=terraform init -backend=false -input=false
          .local/ci-tools/terraform -chdir=terraform validate
          for directory in terraform/aws-bootstrap terraform/aws-staging; do
            .local/ci-tools/terraform -chdir="$directory" init -backend=false -input=false
            .local/ci-tools/terraform -chdir="$directory" validate
            .local/ci-tools/terraform -chdir="$directory" test
          done
          docker compose -f deploy/docker/compose.production.yml config --no-interpolate --no-env-resolution --quiet
      - name: Validation summary
        if: always()
        run: |
          echo 'CI validates source/builds, disposable database migrations, browser fixtures, secrets and deployment policy. Live models, VPS readiness and production deployment are separate gates.' >> "$GITHUB_STEP_SUMMARY"
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {name: node, dockerfile: Backend.Dockerfile, target: runtime, app: ''}
          - {name: pdf, dockerfile: Backend.Dockerfile, target: pdf, app: ''}
          - {name: migration, dockerfile: Backend.Dockerfile, target: migration, app: ''}
          - {name: python, dockerfile: Python.Dockerfile, target: runtime, app: ''}
          - {name: admin, dockerfile: Frontend.Dockerfile, target: '', app: admin}
          - {name: user, dockerfile: Frontend.Dockerfile, target: '', app: user-frontend}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/docker/${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: APP=${{ matrix.app }}
          push: false
          load: true
          tags: doccraft-ci:${{ matrix.name }}
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}
      - name: Image vulnerability scan
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          python deploy/scripts/install-ci-tools.py trivy
          .local/ci-tools/trivy image --exit-code 1 --severity HIGH,CRITICAL "doccraft-ci:$IMAGE_NAME"
  infrastructure-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Scan pinned infrastructure and build base images
        run: |
          python deploy/scripts/install-ci-tools.py trivy
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          failures=[]
          images = list(json.loads(Path('deploy/config/base-images.json').read_text()).values())
          images += [s['image'] for s in json.loads(Path('deploy/aws/compose.staging.yml').read_text())['services'].values() if 'image' in s]
          for image in images:
              result=subprocess.run(['.local/ci-tools/trivy','image','--image-src','remote','--exit-code','1','--severity','HIGH,CRITICAL','--ignore-unfixed',image])
              if result.returncode:failures.append(image)
          if failures:print('Blocked infrastructure images:',*failures,sep='\n')
          sys.exit(bool(failures))
          PY
      - name: Validate public-IP HTTPS configuration without requesting certificates
        run: |
          image=$(python3 -c 'import json; print(json.load(open("deploy/aws/compose.staging.yml"))["services"]["edge"]["image"])')
          docker run --rm -e APP_DOMAIN=192.0.2.10 -e ADMIN_DOMAIN=192.0.2.10:8443 \
            -e ACME_EMAIL=ci@example.com -e ADMIN_ALLOWED_CIDRS=192.0.2.20/32 \
            -v "$PWD/deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$image" caddy adapt --config /etc/caddy/Caddyfile > /dev/null
  publish:
    needs: [validate, docker, infrastructure-images]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-and-push.yml
  deploy:
    needs: publish
    if: github.event_name == 'push' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-production.yml
