name: AWS staging infrastructure
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the saved Terraform plan to the existing staging server's networking
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: aws-staging
  cancel-in-progress: false
jobs:
  infrastructure:
    if: github.ref == 'refs/heads/eranda-dev'
    environment: aws-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: 'true'
      ADMIN_CIDRS: ${{ secrets.AWS_STAGING_ADMIN_CIDRS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-southeast-2
          allowed-account-ids: '506192652462'
      - name: Validate and save the real AWS Terraform plan
        run: |
          python3 deploy/scripts/install-ci-tools.py terraform
          export PATH="$GITHUB_WORKSPACE/.local/ci-tools:$PATH"
          python3 deploy/aws/staging_inputs.py terraform/aws-staging/staging-inputs.auto.tfvars.json
          terraform -chdir=terraform/aws-staging fmt -check
          terraform -chdir=terraform/aws-staging init -input=false \
            -backend-config=bucket=doccraft-staging-tfstate-506192652462-ap-southeast-2 \
            -backend-config=key=aws-staging/terraform.tfstate \
            -backend-config=region=ap-southeast-2 \
            -backend-config=encrypt=true -backend-config=use_lockfile=true
          terraform -chdir=terraform/aws-staging validate
          terraform -chdir=terraform/aws-staging plan -input=false -lock-timeout=5m -out=staging.tfplan
          terraform -chdir=terraform/aws-staging show -no-color staging.tfplan >> "$GITHUB_STEP_SUMMARY"
      - name: Apply the saved plan
        if: inputs.apply
        run: |
          terraform -chdir=terraform/aws-staging apply -input=false staging.tfplan
          terraform -chdir=terraform/aws-staging output -json >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the local plan
        if: always()
        run: rm -f terraform/aws-staging/staging.tfplan terraform/aws-staging/staging-inputs.auto.tfvars.json
