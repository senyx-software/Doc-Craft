name: Deploy production
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && github.event_name == 'push'
    environment: production
    runs-on: ${{ vars.PRODUCTION_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-manifest
          path: release
      - name: Send immutable manifest over restricted verified SSH
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_PORT: ${{ vars.PRODUCTION_PORT || '22' }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER || 'doccraft-deploy' }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/doccraft-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/doccraft-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/doccraft-ssh/known_hosts"
          trap 'rm -rf "$RUNNER_TEMP/doccraft-ssh"' EXIT
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_USER" != root ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          ssh -T -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/doccraft-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/doccraft-ssh/known_hosts" \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$DEPLOY_USER@$DEPLOY_HOST" < release/release.json
      - name: Deployment status
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: echo "Production deployment status $STATUS. Remote failures retain private diagnostics and attempt application rollback only within a compatible schema epoch." >> "$GITHUB_STEP_SUMMARY"
